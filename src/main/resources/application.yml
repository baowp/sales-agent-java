spring:
  application:
    name: sales-agent
  # Read the same KEY=value .env file as the Node.js version (LLM_PROVIDER, GROQ_API_KEY, ...).
  # API keys live in .env (gitignored), never in this file: it is committed and packed into the jar.
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true          # each request blocks on slow LLM calls; virtual threads make that cheap
  mvc:
    async:
      request-timeout: 10m   # /api/ask streams for as long as the agent loop runs

server:
  address: 127.0.0.1         # this computer only
  port: ${PORT:3002}         # 3001 is the Node.js version, so both can run side by side

logging:
  level:
    root: warn

# Which LLM to use. Any value can be overridden from .env, an environment variable,
# or the command line (--llm.provider=groq).
llm:
  provider: ${LLM_PROVIDER:bailian}
  # Leave empty to use the preset's value. Set them for provider "custom" (e.g. a local Ollama).
  model: ${LLM_MODEL:}
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}       # overrides the preset's key
  temperature: 0.2
  # Free-tier, OpenAI-compatible chat APIs with tool calling. Model IDs change often:
  # if one is retired, set LLM_MODEL or edit it here.
  presets:
    groq:
      base-url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api-key: ${GROQ_API_KEY:}
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-2.5-flash
      api-key: ${GEMINI_API_KEY:}
    mistral:
      base-url: https://api.mistral.ai/v1
      model: mistral-small-latest
      api-key: ${MISTRAL_API_KEY:}
    openrouter:
      base-url: https://openrouter.ai/api/v1
      model: openrouter/free
      api-key: ${OPENROUTER_API_KEY:}
    glm:                         # Z AI. Mainland China: https://open.bigmodel.cn/api/paas/v4
      base-url: https://api.z.ai/api/paas/v4
      model: glm-5.3-flash
      api-key: ${ZAI_API_KEY:}
    bailian:                     # 阿里云百炼, Beijing. Free quota is per model.
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen3.7-flash-2026-07-15
      api-key: ${DASHSCOPE_API_KEY:}
    nvidia:
      base-url: https://integrate.api.nvidia.com/v1
      model: openai/gpt-oss-120b
      api-key: ${NVIDIA_API_KEY:}
    ollama:
      base-url: https://ollama.com/v1
      model: gpt-oss:120b
      api-key: ${OLLAMA_API_KEY:}
    custom:                      # set llm.base-url and llm.model; the key is optional
      base-url: ""
      model: ""
      api-key: ""

sales:
  max-steps: ${MAX_STEPS:12}
  request-timeout-seconds: ${REQUEST_TIMEOUT_SECONDS:120}
  sockspal-api: ${SOCKSPAL_API:https://api.sockspal.com/api/v1}
  catalog-cache-seconds: ${CATALOG_CACHE_SECONDS:60}
  rfq-mode: ${RFQ_MODE:draft}
  rfq-dir: rfqs
